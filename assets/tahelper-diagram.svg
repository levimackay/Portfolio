<text x="337.5" y="250.0" text-anchor="middle" dominant-baseline="middle" font-family='"Archivo", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="13.5" fill="#f5f5f7">(fetches enrolled</text>
