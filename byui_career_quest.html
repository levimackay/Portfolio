<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CS Career Quest</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #06080f;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}
#gc {
  position: relative;
  border: 3px solid #005eb8;
  box-shadow: 0 0 40px rgba(0,94,184,0.4);
}
canvas { display: block; }
#titleScreen {
  position: absolute;
  top:0; left:0; width:100%; height:100%;
  background: #06080f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
#titleScreen h1 {
  font-size: 34px;
  color: #005eb8;
  text-shadow: 0 0 20px #005eb8;
  letter-spacing: 6px;
  margin-bottom: 8px;
}
#titleScreen h2 {
  font-size: 12px;
  color: #4488bb;
  letter-spacing: 4px;
  margin-bottom: 6px;
}
#titleScreen .sub {
  font-size: 10px;
  color: #334455;
  letter-spacing: 2px;
  margin-bottom: 36px;
}
.blink {
  animation: blink 1s step-end infinite;
  color: #c8d8ff;
  font-size: 12px;
  letter-spacing: 3px;
}
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="gc">
  <canvas id="c" width="768" height="480"></canvas>

  <div id="titleScreen">
    <h1>⚡ CS QUEST ⚡</h1>
    <h2>THE CAREER ADVENTURE</h2>
    <div class="sub">BYU-IDAHO · COMPUTER SCIENCE</div>
    <div class="blink">▶ PRESS ENTER TO BEGIN ◀</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 768, H = 480;
const T = 48; // tile size
const COLS = 16, ROWS = 10;

// ── PALETTE ──────────────────────────────────────────────────
const C = {
  grass:  '#1c2d1c', grass2: '#182618',
  rock:   '#1a2030', rockD:  '#10151e',
  tree:   '#1a3a1a', treeD:  '#0f2410', treeTrunk: '#2a1a08',
  path:   '#2a2410', pathD:  '#221e0c',
  wall:   '#0d1018',
  water:  '#0a1828', waterS: '#0e2035',
  cave:   '#0a0404', caveW:  '#1e0c0c',
  byuB:   '#005eb8', byuL:   '#2980d4',
  white:  '#e8f4ff', player: '#c8d8ff', eye: '#005eb8',
  dialog: '#06080f', dialogB:'#005eb8',
  gold:   '#ffd700', cyan:   '#00ffff',
  profRobe:'#44228a', profHead:'#e8c896',
};

// ── SCREENS ──────────────────────────────────────────────────
// 0 = grass, 1 = wall, 2 = rock, 3 = water, 4 = tree, 5 = path, 9 = cave entrance
function makeScreen(layout) {
  // layout is array of strings, 16 chars wide, 10 rows
  const tiles = layout.map(row => row.split('').map(Number));
  return tiles;
}

const SCREENS = [
  // Screen 0: spawn — open field, path leads right
  makeScreen([
    '1111111111111111',
    '1004400000044001',
    '1004400000044001',
    '1000000000000000',  // open right exit row 3
    '1000000000000000',  // open right exit row 4
    '1000000000000000',  // open right exit row 5
    '1000000000000000',  // open right exit row 6
    '1002200000022001',
    '1002200000022001',
    '1111111111111111',
  ]),
  // Screen 1: wider field, some trees and a pond
  makeScreen([
    '1111111111111111',
    '0044400000000000',  // open exits row 1
    '0044400000033000',  // open exits row 2
    '0000000000033000',  // open exits row 3
    '0000000000000000',  // open exits row 4
    '0000000000000000',  // open exits row 5
    '0000044400000000',  // open exits row 6
    '0000044400000000',  // open exits row 7
    '1000000000000001',
    '1111111111111111',
  ]),
  // Screen 2: cave screen — path leads to cave in top area
  makeScreen([
    '1111119111111111',  // col 6 = cave entrance tile (tile 9)
    '1000009000000001',
    '1000000000000001',
    '1000000000000001',
    '0000000000000001',  // open left exit row 3
    '0000000000000001',  // open left exit row 4
    '0000000000000001',  // open left exit row 5
    '0000000000000001',  // open left exit row 6
    '1000000000000001',
    '1022000000022001',
    '1022000000022001',
    '1111111111111111',
  ]),
];

// ── STATE ────────────────────────────────────────────────────
let gameRunning = false;
let keys = {};
let s; // state

function init() {
  s = {
    screen: 0,          // which overworld screen (0,1,2)
    inCave: false,

    // Player
    px: T*2, py: T*4,  // pixel position
    dir: 1,             // 0=up 1=right 2=down 3=left
    frame: 0,

    // Screen slide transition
    sliding: false,
    slideDir: 0,        // 1=right, -1=left
    slideT: 0,          // 0..1

    // Dialogue
    dlgStep: -1,        // -1 = no dialogue
    dlgDone: false,

    // Cave arrow pulse
  };
}

// ── DIALOGUE LINES ───────────────────────────────────────────
const DIALOGUE = [
  { text: "Ah, a student approaches! I have been\nwaiting for someone like you." },
  { text: "The tech industry is ruled by a fearsome\nboss: THE REJECTION KING." },
  { text: "You will need a sword to conquer him.\nBut my sword has a price..." },
  { text: "To earn this blade, you must bring me\nthree things:" },
  { text: "  ✦  A polished RESUME\n  ✦  A compelling ELEVATOR PITCH\n  ✦  2 PERSONAL PROJECTS for your portfolio" },
  { text: "Gather these career artifacts, and you\nwill have everything you need to succeed." },
  { text: "The real world awaits, student.\nAre you ready to begin your career quest?" },
];

// ── INPUT ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();

  if (e.code === 'Enter' && !gameRunning) {
    document.getElementById('titleScreen').style.display = 'none';
    gameRunning = true;
    loop();
    return;
  }

  // Advance dialogue
  if ((e.code === 'Space' || e.code === 'Enter') && s.inCave && s.dlgStep >= 0) {
    s.dlgStep++;
    if (s.dlgStep >= DIALOGUE.length) {
      s.dlgStep = -1;
      s.dlgDone = true;
    }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ── LOOP ─────────────────────────────────────────────────────
function loop() {
  if (!gameRunning) return;
  update();
  render();
  requestAnimationFrame(loop);
}

// ── UPDATE ───────────────────────────────────────────────────
function update() {
  s.frame++;

  if (s.sliding) {
    s.slideT += 0.055;
    if (s.slideT >= 1) {
      s.slideT = 1;
      s.sliding = false;
      // Land well inside new screen, away from the triggering edge
      if (s.slideDir === 1) s.px = T * 2;         // came from left → 2 tiles in
      else                  s.px = W - T*3 - 28;  // came from right → 3 tiles from right
      s.py = T*4 + 10;
    }
    return;
  }

  if (s.inCave && s.dlgStep >= 0) return; // freeze movement during dialogue

  movePlayer();
  checkCaveEntry();
}

function movePlayer() {
  const spd = 1.5;
  let dx = 0, dy = 0;
  if (keys['ArrowRight'] || keys['KeyD']) { dx =  spd; s.dir = 1; }
  if (keys['ArrowLeft']  || keys['KeyA']) { dx = -spd; s.dir = 3; }
  if (keys['ArrowUp']    || keys['KeyW']) { dy = -spd; s.dir = 0; }
  if (keys['ArrowDown']  || keys['KeyS']) { dy =  spd; s.dir = 2; }
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }

  const tiles = s.inCave ? caveTiles() : SCREENS[s.screen];
  const nx = s.px + dx, ny = s.py + dy;
  if (!colTiles(nx, s.py, 28, 28, tiles)) s.px = nx;
  if (!colTiles(s.px, ny, 28, 28, tiles)) s.py = ny;

  // Screen transitions (overworld only)
  if (!s.inCave) {
    if (s.px + 28 >= W - 1 && s.screen < 2) {
      s.px = W - 30;
      s.screen++;
      s.sliding = true;
      s.slideDir = 1;
      s.slideT = 0;
    } else if (s.px <= 0 && s.screen > 0) {
      s.px = 1;
      s.screen--;
      s.sliding = true;
      s.slideDir = -1;
      s.slideT = 0;
    }
  }

  // Cave exit: walk south out of cave
  if (s.inCave && s.py > T*8 && !s.dlgDone && s.dlgStep < 0) {
    // not started yet, let them walk further
  }
  if (s.inCave && s.py > T*8.5) {
    exitCave();
  }
}

function checkCaveEntry() {
  if (s.screen !== 2) return;
  const cx = Math.floor((s.px + 14) / T);
  const cy = Math.floor((s.py + 14) / T);
  if (cy === 0 && cx === 6) {
    enterCave();
  }
}

function enterCave() {
  s.inCave = true;
  s.px = T*7; s.py = T*8;
  s.dir = 0;
}

function exitCave() {
  s.inCave = false;
  s.px = T*6; s.py = T*3;
  s.screen = 2;
  s.dlgDone = true;
}

// ── CAVE TILES ───────────────────────────────────────────────
let _caveTiles = null;
function caveTiles() {
  if (_caveTiles) return _caveTiles;
  _caveTiles = [];
  for (let r=0;r<ROWS;r++) {
    _caveTiles[r] = [];
    for (let c=0;c<COLS;c++) {
      // Wall everywhere except carved interior
      _caveTiles[r][c] = (r<2||r>8||c<1||c>14) ? 1 : 0;
    }
  }
  // Some rock pillars
  _caveTiles[3][3]=1; _caveTiles[3][4]=1;
  _caveTiles[3][11]=1; _caveTiles[3][12]=1;
  _caveTiles[6][3]=1; _caveTiles[6][12]=1;
  // Open south exit
  _caveTiles[8][7]=0; _caveTiles[8][8]=0; _caveTiles[9][7]=0; _caveTiles[9][8]=0;
  return _caveTiles;
}

// Professor position (tile 10,3)
const PROF_TX = 10, PROF_TY = 3;

// ── COLLISION ────────────────────────────────────────────────
function isSolid(tx, ty, tiles) {
  if (ty < 0 || ty >= ROWS) return true;
  if (tx < 0 || tx >= COLS) return false; // allow walking off left/right edges
  return tiles[ty][tx] === 1;
}
function colTiles(x, y, w, h, tiles) {
  const x1=Math.floor(x/T), y1=Math.floor(y/T);
  const x2=Math.floor((x+w-1)/T), y2=Math.floor((y+h-1)/T);
  for (let ty=y1;ty<=y2;ty++)
    for (let tx=x1;tx<=x2;tx++)
      if (isSolid(tx,ty,tiles)) return true;
  return false;
}

// ── RENDER ───────────────────────────────────────────────────
function render() {
  ctx.fillStyle = '#06080f';
  ctx.fillRect(0,0,W,H);

  if (s.sliding) {
    renderSlide();
  } else if (s.inCave) {
    renderCave();
  } else {
    renderScreen(SCREENS[s.screen], 0);
    drawPlayer(s.px, s.py, s.dir, s.frame);
    drawCaveArrow();
  }
}

// ── SLIDE TRANSITION ─────────────────────────────────────────
function renderSlide() {
  const t = easeInOut(s.slideT);
  const offset = t * W * s.slideDir; // negative = slide left (going right)

  // Old screen (slides away)
  const oldScreen = s.slideDir === 1 ? s.screen - 1 : s.screen + 1;
  ctx.save();
  ctx.translate(-offset, 0);
  renderScreen(SCREENS[oldScreen], 0);
  ctx.restore();

  // New screen (slides in)
  ctx.save();
  ctx.translate(W * s.slideDir - offset, 0);
  renderScreen(SCREENS[s.screen], 0);
  ctx.restore();

  // Player stays put in center-ish during transition
  drawPlayer(s.px, s.py, s.dir, s.frame);
}

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
}

// ── DRAW A SCREEN ────────────────────────────────────────────
function renderScreen(tiles, offsetX) {
  for (let r=0;r<ROWS;r++)
    for (let c=0;c<COLS;c++)
      drawTile(c, r, tiles[r][c], offsetX);
}

function drawTile(tc, tr, t, ox) {
  const x = tc*T + (ox||0), y = tr*T;
  switch(t) {
    case 0: // grass
      ctx.fillStyle = (tc+tr)%2===0 ? C.grass : C.grass2;
      ctx.fillRect(x,y,T,T);
      // tiny detail blades
      if ((tc*3+tr*7+tc)%6===0) {
        ctx.fillStyle='rgba(100,160,80,0.08)';
        ctx.fillRect(x+10,y+14,3,8);
        ctx.fillRect(x+28,y+8,3,10);
        ctx.fillRect(x+38,y+20,3,6);
      }
      break;
    case 1: // wall/border
      ctx.fillStyle = C.wall;
      ctx.fillRect(x,y,T,T);
      ctx.fillStyle = C.rockD;
      ctx.fillRect(x+2,y+2,T-4,T-4);
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      ctx.fillRect(x+2,y+2,T-4,2);
      break;
    case 2: // rock obstacle
      ctx.fillStyle = (tc+tr)%2===0 ? C.grass : C.grass2;
      ctx.fillRect(x,y,T,T);
      ctx.fillStyle = C.rockD;
      ctx.fillRect(x+5,y+5,T-10,T-10);
      ctx.fillStyle = C.rock;
      ctx.fillRect(x+8,y+8,T-16,T-16);
      ctx.fillStyle='rgba(255,255,255,0.05)';
      ctx.fillRect(x+8,y+8,T-16,4);
      break;
    case 3: // water
      ctx.fillStyle = C.water;
      ctx.fillRect(x,y,T,T);
      const wv = Math.floor(s.frame*0.4)%6;
      ctx.fillStyle = C.waterS;
      ctx.fillRect(x+wv, y+10, T-wv*2, 4);
      ctx.fillRect(x+T-6-wv, y+26, 16+wv, 4);
      ctx.fillStyle='rgba(100,180,255,0.06)';
      ctx.fillRect(x,y,T,T);
      break;
    case 4: // tree
      ctx.fillStyle = (tc+tr)%2===0 ? C.grass : C.grass2;
      ctx.fillRect(x,y,T,T);
      // Canopy layers
      ctx.fillStyle = C.treeD;
      ctx.fillRect(x+4,y+2,T-8,T-10);
      ctx.fillStyle = C.tree;
      ctx.fillRect(x+8,y+5,T-16,T-14);
      ctx.fillStyle = '#22481a';
      ctx.fillRect(x+12,y+8,T-24,T-18);
      // Trunk
      ctx.fillStyle = C.treeTrunk;
      ctx.fillRect(x+T/2-4,y+T-12,8,12);
      break;
    case 5: // dirt path
      ctx.fillStyle = C.pathD;
      ctx.fillRect(x,y,T,T);
      ctx.fillStyle = C.path;
      ctx.fillRect(x+2,y+2,T-4,T-4);
      break;
    case 9: // cave entrance
      ctx.fillStyle = (tc+tr)%2===0 ? C.grass : C.grass2;
      ctx.fillRect(x,y,T,T);
      // Cave mouth
      ctx.fillStyle = C.caveW;
      ctx.fillRect(x+4,y,T-8,T);
      ctx.fillStyle = C.cave;
      ctx.beginPath();
      ctx.arc(x+T/2, y+T*0.5, T*0.36, Math.PI, 0);
      ctx.rect(x+T/2-T*0.36, y+T*0.5, T*0.72, T*0.5);
      ctx.fill();
      // Warm glow inside
      const cg = ctx.createRadialGradient(x+T/2,y+T*0.5,2,x+T/2,y+T*0.5,T*0.4);
      cg.addColorStop(0,'rgba(255,140,60,0.22)');
      cg.addColorStop(1,'rgba(255,100,30,0)');
      ctx.fillStyle=cg;
      ctx.fillRect(x,y,T,T);
      // Label
      ctx.fillStyle='#ffaa55';
      ctx.font='bold 8px monospace';
      ctx.textAlign='center';
      ctx.fillText('CAVE',x+T/2,y+T-4);
      break;
    default: // cave interior wall
      if (t === 0) break;
      ctx.fillStyle = C.cave;
      ctx.fillRect(x,y,T,T);
      ctx.fillStyle = C.caveW;
      ctx.fillRect(x+3,y+3,T-6,T-6);
  }
}

// ── CAVE RENDER ──────────────────────────────────────────────
function renderCave() {
  // Dark background
  ctx.fillStyle = '#080404';
  ctx.fillRect(0,0,W,H);

  // Draw cave tiles
  const tiles = caveTiles();
  for (let r=0;r<ROWS;r++)
    for (let c=0;c<COLS;c++)
      drawCaveTile(c,r,tiles[r][c]);

  // Torches
  drawTorch(T*3,   T*2.5);
  drawTorch(T*13,  T*2.5);
  drawTorch(T*3,   T*6.5);
  drawTorch(T*13,  T*6.5);

  // Professor
  drawProfessor(PROF_TX*T, PROF_TY*T);

  // Player
  drawPlayer(s.px, s.py, s.dir, s.frame);

  // Check proximity → start dialogue
  const dist = Math.hypot(s.px+14 - PROF_TX*T - 24, s.py+14 - PROF_TY*T - 24);
  if (dist < T*2.8 && s.dlgStep < 0 && !s.dlgDone) {
    s.dlgStep = 0;
  }

  // Dialogue
  if (s.dlgStep >= 0 && s.dlgStep < DIALOGUE.length) {
    drawDialogue(DIALOGUE[s.dlgStep]);
  }

  // "Walk south to exit" hint after done
  if (s.dlgDone) {
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(W/2-100, H-36, 200, 22);
    ctx.fillStyle='#aabb99';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    ctx.fillText('Walk south to exit', W/2, H-20);
  }
}

function drawCaveTile(tc, tr, t) {
  const x=tc*T, y=tr*T;
  if (t===1) {
    ctx.fillStyle='#0a0606';
    ctx.fillRect(x,y,T,T);
    ctx.fillStyle='#160d0d';
    ctx.fillRect(x+2,y+2,T-4,T-4);
  } else {
    // Floor — dark stone
    ctx.fillStyle=(tc+tr)%2===0?'#120909':'#100808';
    ctx.fillRect(x,y,T,T);
    // Subtle crack
    if ((tc*5+tr*3)%7===0) {
      ctx.strokeStyle='rgba(80,50,50,0.3)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x+6,y+12); ctx.lineTo(x+18,y+28); ctx.lineTo(x+30,y+24);
      ctx.stroke();
    }
  }
}

function drawTorch(tx, ty) {
  const flicker = Math.sin(s.frame*0.19+tx*0.01)*0.12;
  const r = T*2.6*(1+flicker);
  const grad=ctx.createRadialGradient(tx,ty,3,tx,ty,r);
  grad.addColorStop(0,'rgba(255,180,60,0.28)');
  grad.addColorStop(0.5,'rgba(255,120,30,0.1)');
  grad.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(tx,ty,r,0,Math.PI*2); ctx.fill();

  // Bracket
  ctx.fillStyle='#331100';
  ctx.fillRect(tx-3,ty,6,14);
  // Head
  ctx.fillStyle='#554422';
  ctx.fillRect(tx-5,ty-8,10,10);
  // Flame
  const fh = 6+Math.round(Math.sin(s.frame*0.28)*2);
  ctx.fillStyle='rgba(255,200,50,0.9)';
  ctx.fillRect(tx-2,ty-8-fh,4,fh);
  ctx.fillStyle='rgba(255,120,20,0.7)';
  ctx.fillRect(tx-1,ty-10-fh,2,4);
}

function drawProfessor(x, y) {
  const bob = Math.sin(s.frame*0.05)*1.5;

  // Robe
  ctx.fillStyle=C.profRobe;
  ctx.fillRect(x+4, y+20+bob, 40, 30);
  // Robe trim
  ctx.fillStyle='#6633aa';
  ctx.fillRect(x+4, y+20+bob, 40, 4);
  ctx.fillRect(x+4, y+46+bob, 40, 4);

  // Head
  ctx.fillStyle=C.profHead;
  ctx.fillRect(x+10, y+4+bob, 28, 20);

  // Hat brim
  ctx.fillStyle='#1a0033';
  ctx.fillRect(x+6, y-2+bob, 36, 7);
  // Hat cone
  ctx.fillStyle='#220044';
  ctx.fillRect(x+14, y-18+bob, 20, 18);
  // Star on hat
  ctx.fillStyle='#ffd700';
  ctx.font='11px serif';
  ctx.textAlign='center';
  ctx.fillText('★', x+24, y-5+bob);

  // Eyes
  ctx.fillStyle='#1a1a2a';
  ctx.fillRect(x+14, y+10+bob, 5, 5);
  ctx.fillRect(x+29, y+10+bob, 5, 5);
  // Eyebrows
  ctx.fillStyle='#888888';
  ctx.fillRect(x+12, y+8+bob, 8, 2);
  ctx.fillRect(x+27, y+8+bob, 8, 2);

  // Beard
  ctx.fillStyle='#cccccc';
  ctx.fillRect(x+9,  y+20+bob, 30, 6);
  ctx.fillRect(x+11, y+24+bob, 26, 8);
  ctx.fillRect(x+14, y+30+bob, 20, 4);

  // Wand arm
  ctx.fillStyle=C.profHead;
  ctx.fillRect(x+44, y+22+bob, 8, 16);
  ctx.strokeStyle='#774400';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x+48, y+22+bob);
  ctx.lineTo(x+62, y+4+bob);
  ctx.stroke();
  // Wand tip sparkle
  const sp=0.5+Math.sin(s.frame*0.15)*0.3;
  ctx.fillStyle=`rgba(200,150,255,${sp})`;
  ctx.beginPath(); ctx.arc(x+62,y+4+bob,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,220,255,0.8)';
  ctx.beginPath(); ctx.arc(x+62,y+4+bob,2,0,Math.PI*2); ctx.fill();

  // Name tag
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(x,y-28,56,14);
  ctx.strokeStyle=C.byuB;
  ctx.lineWidth=1;
  ctx.strokeRect(x,y-28,56,14);
  ctx.fillStyle='#ffddaa';
  ctx.font='bold 8px monospace';
  ctx.textAlign='center';
  ctx.fillText('PROFESSOR',x+28,y-18);
}

// ── DIALOGUE BOX ─────────────────────────────────────────────
function drawDialogue(d) {
  const bh = 130, by = H - bh - 2;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(6,by+4,W-8,bh);
  // Box
  ctx.fillStyle=C.dialog;
  ctx.fillRect(4,by,W-8,bh);
  // Border
  ctx.strokeStyle=C.dialogB;
  ctx.lineWidth=2;
  ctx.strokeRect(4,by,W-8,bh);
  // Inner border
  ctx.strokeStyle='rgba(0,94,184,0.25)';
  ctx.lineWidth=1;
  ctx.strokeRect(8,by+4,W-16,bh-8);

  // Speaker
  ctx.fillStyle=C.byuL;
  ctx.font='bold 11px monospace';
  ctx.textAlign='left';
  ctx.fillText('PROFESSOR CORNELIUS', 18, by+22);

  // Line under speaker
  ctx.strokeStyle='rgba(0,94,184,0.4)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(18,by+26); ctx.lineTo(W-18,by+26); ctx.stroke();

  // Text (handle \n)
  ctx.fillStyle=C.white;
  ctx.font='13px monospace';
  const lines = d.text.split('\n');
  lines.forEach((line,i) => {
    ctx.fillText(line, 18, by+46+i*20);
  });

  // Progress indicator
  const step = s.dlgStep+1, total = DIALOGUE.length;
  ctx.fillStyle='rgba(0,94,184,0.5)';
  ctx.font='9px monospace';
  ctx.textAlign='left';
  ctx.fillText(`${step}/${total}`, 18, by+bh-10);

  // Blink prompt
  if (Math.floor(s.frame/20)%2===0) {
    ctx.fillStyle='#88aa77';
    ctx.font='10px monospace';
    ctx.textAlign='right';
    const last = s.dlgStep === DIALOGUE.length-1;
    ctx.fillText(last ? '[ SPACE — done ]' : '[ SPACE — next ]', W-16, by+bh-10);
  }
}

// ── PLAYER DRAW ──────────────────────────────────────────────
function drawPlayer(px, py, dir, frame) {
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect(px+4,py+26,20,6);

  // Body
  ctx.fillStyle=C.byuB;
  ctx.fillRect(px+5,py+13,18,15);

  // Head
  ctx.fillStyle=C.player;
  ctx.fillRect(px+6,py,16,14);

  // Hair
  ctx.fillStyle='#6633aa';
  ctx.fillRect(px+6,py,16,5);

  // Eyes
  ctx.fillStyle=C.eye;
  if (dir===2)      { ctx.fillRect(px+8,py+6,4,4); ctx.fillRect(px+16,py+6,4,4); }
  else if (dir===0) { ctx.fillRect(px+8,py+7,4,3); ctx.fillRect(px+16,py+7,4,3); }
  else if (dir===1) { ctx.fillRect(px+18,py+6,4,4); }
  else              { ctx.fillRect(px+6,py+6,4,4); }

  // Backpack
  ctx.fillStyle='#1a2535';
  ctx.fillRect(px+7,py+15,14,12);
  ctx.fillStyle=C.byuL;
  ctx.fillRect(px+9,py+17,10,8);
  // Screen glow
  ctx.fillStyle='rgba(0,220,180,0.4)';
  ctx.fillRect(px+9,py+17,10,3);

  // Walk bob legs
  const bob = Math.floor(frame/8)%2===0;
  ctx.fillStyle=C.byuB;
  if (bob) {
    ctx.fillRect(px+6, py+26,7,6);
    ctx.fillRect(px+15,py+24,7,8);
  } else {
    ctx.fillRect(px+6, py+24,7,8);
    ctx.fillRect(px+15,py+26,7,6);
  }
}

// ── CAVE ENTRANCE ARROW ──────────────────────────────────────
function drawCaveArrow() {
  if (s.screen !== 2) return;
  const bob = Math.sin(s.frame*0.12)*4;
  const ax = 6*T + T/2, ay = -8+bob;
  ctx.fillStyle='#ffd700';
  ctx.font='bold 20px monospace';
  ctx.textAlign='center';
  ctx.fillText('▼', ax, ay+16);
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(ax-28,ay+18,56,13);
  ctx.fillStyle='#ffd700';
  ctx.font='bold 7px monospace';
  ctx.fillText('ENTER CAVE', ax, ay+28);
}

// ── INIT ─────────────────────────────────────────────────────
init();
</script>
